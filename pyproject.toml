[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kbrag"
version = "0.1.0"
description = "RAG-ассистент по корпоративной базе знаний с воспроизводимой оценкой качества (retrieval + generation)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "pyyaml>=6.0",
    "pydantic>=2.6",
    "httpx>=0.27",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    # «Полы» безопасности для зависимостей FastAPI и uvicorn: сами они разрешают старые версии
    # с известными уязвимостями, поэтому ограничиваем их явно (pip учтёт и эти строки):
    #   starlette < 0.49.1 — CVE-2025-62727, DoS через заголовок Range в FileResponse (так отдаётся GET /);
    #   h11 < 0.16         — CVE-2025-43859, request smuggling через chunked encoding.
    "starlette>=0.49.1",
    "h11>=0.16",
    "snowballstemmer>=2.2",
]

[project.optional-dependencies]
# Нейросетевые эмбеддинги и реранкер. Без них проект работает на BM25 + LSA.
# torch < 2.6 — CVE-2025-32434 (выполнение кода через torch.load даже с weights_only=True).
# Ту же границу повторяют Dockerfile и Makefile (torch ставится отдельно из CPU-индекса).
neural = [
    "sentence-transformers>=3.0",
    "torch>=2.6",
]
# Классический ML для классификатора отказа (kbrag.abstention): градиентный бустинг CatBoost.
# Логистической регрессии хватает scikit-learn из ядра, поэтому пакет необязательный.
classic = [
    "catboost>=1.2",
]
dev = [
    "pytest>=8.0",
    # CI ставит только .[dev]: без catboost тесты модели catboost пропускались бы, и поломку никто бы не увидел.
    "catboost>=1.2",
    # Верхняя граница: стиль `ruff format` меняется между минорными версиями, а CI проверяет
    # форматирование (`ruff format --check`) — без границы новый релиз ruff ломал бы CI на старом коде.
    "ruff>=0.17.2,<0.18",
]

[project.scripts]
kbrag = "kbrag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kbrag = ["api/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
markers = [
    "neural: тесты, которым нужны sentence-transformers и скачанные модели (пропускаются, если их нет)",
]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]
