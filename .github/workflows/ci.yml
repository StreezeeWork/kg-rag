# CI: на каждый push в main и pull request проверяем, что проект собирается, код чистый,
# тесты зелёные, данные согласованы, а качество поиска не упало ниже порога.
# Всё работает офлайн (configs/offline.yaml): нейросетевые модели в CI не скачиваются.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # ручной запуск из вкладки Actions

# Минимальные права: workflow только читает код.
permissions:
  contents: read

# Новый push в ту же ветку отменяет устаревший прогон — не тратим минуты CI впустую.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # Падение на одной версии Python не отменяет проверку на другой: видно, где именно проблема.
      fail-fast: false
      matrix:
        # Минимальная поддерживаемая (requires-python >= 3.10) и та, что в Docker-образе.
        python-version: ["3.10", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package (core + dev)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (ruff)
        # Единый стиль без споров на ревью. Упало — выполните локально `make format` и закоммитьте.
        run: ruff format --check .

      - name: Unit tests
        # Тесты с маркером neural пропускаются сами: KBRAG_RUN_NEURAL не равна "1".
        run: pytest

      - name: Check gold set is up to date
        # Только проверка: data/eval/gold.jsonl должен совпадать с тем, что собирается из parts/*.jsonl.
        # Если упало — запустите локально `make data` и закоммитьте gold.jsonl.
        run: kbrag build-gold --check

      - name: Validate corpus and gold set
        run: kbrag validate-data

      - name: Offline evaluation (quality gate)
        # Код возврата 2, если метрика ниже порога: регрессия качества ломает CI, как и упавший тест.
        # Порог = значение офлайн-конфига на test минус запас ~0.05, округлённое вниз до 0.05.
        # Оценка детерминирована, так что запас ловит именно регрессии, а не шум:
        #   recall@5           ≈ 0.837 → 0.75  (поиск: нарезка, BM25, LSA, эталон);
        #   fact_recall        ≈ 0.587 → 0.50  (ответ содержит ключевые факты; отказ на отвечаемый вопрос = 0);
        #   citation_precision ≈ 0.600 → 0.55  (ссылки [n] ведут на нужные фрагменты).
        # Значения — эталон из 237 вопросов (test: 131 отвечаемый + 35 неотвечаемых), lsa_dim 128.
        # abstain_f1 (≈ 0.45) пока не проверяем: он зависит от порога, подобранного на 15 неотвечаемых
        # dev-вопросах, и от доли неотвечаемых в test — для quality gate слишком шумный.
        # Улучшили качество — поднимите порог (значения — в reports/ci/leaderboard.md артефакта).
        # --save-calibration перезаписывает reports/calibration_offline.json свежим порогом;
        # закоммиченную версию сначала откладываем, чтобы сравнить на следующем шаге.
        run: |
          cp reports/calibration_offline.json "$RUNNER_TEMP/calibration_committed.json"
          kbrag eval --config configs/offline.yaml --name ci --save-calibration \
            --fail-under recall@5=0.75 fact_recall=0.50 citation_precision=0.55

      - name: Check abstention calibration is up to date
        # Порог отказа лежит в git (его читает сервис). Если правка корпуса или эталона сдвинула
        # порог, а файл не обновили, — падаем. Исправление: `make eval` и коммит файла калибровки.
        run: python scripts/check_calibration.py "$RUNNER_TEMP/calibration_committed.json" reports/calibration_offline.json

      - name: Upload reports
        # always(): отчёт нужен и тогда, когда quality gate не пройден, — чтобы понять, что сломалось.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-py${{ matrix.python-version }}
          path: reports/
          if-no-files-found: ignore
          retention-days: 14

  test-windows:
    # Проект разрабатывают на Windows. Главное отличие от Linux — кодировка: когда вывод CLI идёт
    # в файл или pipe, Python берёт кодировку системы (cp1252), и кириллица может уронить команду.
    # Одной версии Python достаточно: остальное проверяет job test.
    name: test (windows, python 3.12)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package (core + dev)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Unit tests
        run: pytest

      - name: CLI with output redirected to files
        # Вывод в файл — как в скриптах и пайплайнах. В интерактивной консоли Windows Python пишет
        # через UTF-16, поэтому у разработчика ошибка кодировки не видна, а здесь — видна.
        shell: bash
        run: |
          kbrag validate-data > validate.txt
          kbrag ask "VPN" > ask.txt
          cat validate.txt ask.txt

  docker:
    # Образ собирается только из того, что лежит в git, — так ловим COPY несуществующего файла
    # (например, README.md), сломанный Dockerfile и сервис, который не стартует в контейнере.
    # Ядро без torch: нейросетевой образ собирается так же, но качает ~1 ГБ колёс.
    name: docker (core image)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build image
        run: docker build --build-arg INSTALL_NEURAL=false -t kbrag:ci .

      - name: Smoke test (GET /health, POST /ask)
        # /health отвечает, когда индекс построен. abstention_threshold не null — значит, калибровка
        # порога из git попала в образ и сервис умеет отвечать «нет ответа».
        run: |
          docker run -d --name kbrag -p 127.0.0.1:8080:8080 kbrag:ci
          curl -fsS --retry 30 --retry-delay 2 --retry-all-errors http://127.0.0.1:8080/health > health.json
          cat health.json
          python3 -c "import json; h = json.load(open('health.json')); assert h['abstention_threshold'] is not None, h"
          curl -fsS -X POST http://127.0.0.1:8080/ask -H "Content-Type: application/json" \
            -d '{"question": "Сколько дней длится ежегодный отпуск?"}'

      - name: Container logs
        if: always()
        run: docker logs kbrag || true
