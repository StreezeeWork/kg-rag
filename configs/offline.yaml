# Офлайн-конфиг: работает без нейросетей, GPU и интернета.
#
# Зачем он нужен:
#   * CI и быстрые проверки — ставится за минуту (`pip install -e .[dev]`), ничего не скачивает;
#   * базовая линия для экспериментов (configs/experiments.yaml наследует его как `base`);
#   * Docker-образ по умолчанию (без torch) запускается именно с ним.
#
# Каждый параметр соответствует полю в src/kbrag/config.py. Опечатка в имени ключа —
# ошибка валидации при запуске, а не тихо проигнорированная настройка.

corpus_dir: data/corpus            # откуда читаем markdown-документы базы знаний
gold_path: data/eval/gold.jsonl    # эталонные вопросы для оценки (собирает `kbrag build-gold`)
cache_dir: .cache                  # кэш эмбеддингов и моделей; можно безопасно удалить
reports_dir: reports               # сюда пишутся отчёты оценки (results.json, leaderboard.md)

chunking:
  strategy: recursive   # режем по заголовкам markdown, а не окнами вслепую: фрагмент = смысловой раздел
  chunk_size: 180       # больше самого длинного раздела корпуса (166 слов): сейчас каждый раздел целиком — один
                        # фрагмент. Лимит — страховка для будущих длинных документов: тогда включится деление
                        # на абзацы, предложения и окна слов. Меньшие размеры проверяет configs/experiments.yaml
  chunk_overlap: 30     # используется только стратегией fixed; для recursive перекрытие не нужно
  with_header: true     # приписываем «Документ / Раздел» к тексту фрагмента — «Срок 5 дней» без заголовка ни о чём

retrieval:
  mode: hybrid          # BM25 ловит точные термины и коды, dense — перефразы; вместе надёжнее каждого
  top_k: 5              # столько фрагментов видит генератор: хватает для ответа и не тонет в шуме
  candidates_k: 30      # сколько кандидатов каждый поисковик отдаёт на слияние (и реранкеру, если он есть)
  bm25:
    k1: 1.5             # насыщение частоты слова: 10 повторов не в 10 раз важнее одного
    b: 0.75             # штраф за длину фрагмента: длинный текст не должен выигрывать «количеством слов»
  dense:
    embedder: lsa       # TF-IDF по буквенным n-граммам + SVD: «плотный» поиск без нейросети
    lsa_dim: 256        # размерность латентного пространства; больше — точнее, но медленнее и шумнее
  hybrid:
    fusion: rrf         # Reciprocal Rank Fusion: сливаем по рангам, шкалы score у BM25 и LSA несравнимы
    rrf_k: 60           # сглаживание RRF (значение из оригинальной статьи): гасит перевес первых мест
    weights:            # равный вклад компонентов; перекос проверяем экспериментом hybrid_bm25_lsa_weighted
      bm25: 0.5
      dense: 0.5

rerank:
  enabled: false        # cross-encoder требует нейросетей; в офлайн-режиме порядок даёт гибридный поиск

generation:
  backend: extractive   # без LLM: собираем ответ из предложений найденных фрагментов со ссылками [n]
  max_sentences: 3      # короткий ответ: 1–3 предложения читаются быстрее, чем пересказ всего контекста
  max_context_chars: 6000  # лимит текста контекста — тот же, что для LLM, чтобы режимы были сопоставимы

abstention:
  enabled: true         # лучше честно сказать «нет ответа», чем уверенно выдумать
  threshold: auto       # порог уверенности подбирается на dev-выборке при `kbrag eval`, а не «на глаз»
  score_source: auto    # без реранкера уверенность берётся из dense-score (он сравним между вопросами)
  calibration_path: reports/calibration_offline.json  # отдельный файл: калибровка зависит от конфига поиска

guardrails:
  enabled: true         # документы — данные, а не команды: ищем во фрагментах попытки prompt injection
  action: drop_line     # вырезаем только подозрительную строку, полезный текст фрагмента остаётся

eval:
  k_values: [1, 3, 5, 10]  # для каких k считаем hit@k / recall@k / nDCG@k
  report_split: test       # итоговые цифры — только на test; dev занят подбором порога
  judge:
    enabled: false         # LLM-судья нужен только при наличии LLM; офлайн считаем метрики без него
